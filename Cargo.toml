[package]
name = "lawpdf"
version = "0.2.34"
edition = "2024"
description = "Native PDF reader and annotation editor for legal workflows"
license = "MIT"

[features]
default = []
devtools = []
microsoft-store = []
bench-image-conversion = ["devtools"]

[dependencies]
anyhow = "1.0"
blake2b_simd = "1.0"
crossbeam-channel = "0.5"
tract-onnx = "0.23.1"
eframe = { version = "0.33", default-features = true }
egui = "0.33"
ed25519-dalek = "3.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
getrandom = "0.3"
libloading = "0.8"
keyring = { version = "4.2", default-features = false, features = ["v1"] }
lopdf = "0.42"
pdfium-render = { version = "0.8", features = ["image", "sync"] }
quick-xml = "0.41"
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
schemars = { version = "0.8", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "local-offset"] }
tempfile = "3"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSApplication", "NSMenu", "NSMenuItem", "NSResponder", "std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSAppleEventDescriptor", "NSAppleEventManager", "NSNotification", "NSObject", "NSString", "NSUserDefaults", "NSURL", "objc2-core-services", "std"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Media_Speech", "Win32_System_Com", "Win32_Storage_Packaging_Appx"] }

[build-dependencies]
winresource = { version = "0.1.31", default-features = false }
