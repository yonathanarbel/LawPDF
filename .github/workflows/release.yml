name: Release

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64
    timeout-minutes: 90
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: C:\tmp\lawpdf-target

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure Rust
        shell: pwsh
        run: |
          rustup show active-toolchain
          rustup target add x86_64-pc-windows-msvc

      - name: Fetch pinned CatBoost runtime
        shell: pwsh
        run: .\scripts\fetch-catboost-windows.ps1

      - name: Verify release manifest and assets
        shell: pwsh
        run: |
          $arguments = @(
            "tools\verify_release_manifest.py",
            "--platform", "windows",
            "--require-platform-library"
          )
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $arguments += @("--expected-version", $env:GITHUB_REF_NAME.TrimStart("v"))
          }
          python @arguments

      - name: Run all regression tests
        shell: pwsh
        run: |
          cargo test --release --locked --target x86_64-pc-windows-msvc

      - name: Build release
        shell: pwsh
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Stage target executable
        shell: pwsh
        run: |
          $stagingDir = Join-Path $env:CARGO_TARGET_DIR "release"
          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null
          Copy-Item (Join-Path $env:CARGO_TARGET_DIR "x86_64-pc-windows-msvc\release\lawpdf.exe") (Join-Path $stagingDir "lawpdf.exe") -Force

      - name: Build portable zip
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\package-windows.ps1 -Configuration release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -like "v*") {
            $env:GITHUB_REF_NAME.TrimStart("v")
          } else {
            (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          }
          $isccCandidates = @(
            (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"),
            (Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe"),
            (Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 6\ISCC.exe")
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe was not found after installing Inno Setup." }
          & $iscc .\packaging\windows\LawPDF.iss /DAppVersion=$version

      - name: Create Windows SHA-256 manifest fragment
        shell: pwsh
        run: |
          $assets = @(
            "LawPDFSetup-x64.exe",
            "LawPDF-windows-portable-x64.zip"
          )
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath (Join-Path "dist" $asset) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $asset"
          }
          Set-Content -LiteralPath dist\SHA256SUMS-windows.txt -Value $lines -Encoding ascii

      - name: Install the exact Windows release and verify it
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $installer = 'dist/LawPDFSetup-x64.exe'
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          ./scripts/verify-windows-install.ps1 -Installer $installer -ExpectedVersion $version -ExpectedSha256 $hash

      - name: Upload Windows installation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LawPDF-Windows-installation-evidence
          path: C:/tmp/lawpdf-install-evidence
          retention-days: 14

      - name: Upload portable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LawPDF-windows-portable-x64
          path: dist/LawPDF-windows-portable-x64.zip

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LawPDFSetup-x64
          path: dist/LawPDFSetup-x64.exe

      - name: Upload Windows checksum fragment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LawPDF-SHA256SUMS-windows
          path: dist/SHA256SUMS-windows.txt

  macos:
    name: macOS arm64
    timeout-minutes: 90
    runs-on: macos-15
    env:
      CARGO_TARGET_DIR: /tmp/lawpdf-target

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure Rust
        run: rustup show active-toolchain

      - name: Verify release manifest and assets
        run: |
          args=(--platform macos --require-platform-library)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            args+=(--expected-version "${GITHUB_REF_NAME#v}")
          fi
          python3 tools/verify_release_manifest.py "${args[@]}"

      - name: Run all regression tests
        run: |
          cargo test --release --locked

      - name: Build and verify app bundle
        run: bash scripts/package-macos.sh

      - name: Create macOS SHA-256 manifest fragment
        run: (cd dist && shasum -a 256 LawPDF-macos.zip > SHA256SUMS-macos.txt)

      - name: Upload macOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LawPDF-macos
          path: dist/LawPDF-macos.zip

      - name: Upload macOS checksum fragment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LawPDF-SHA256SUMS-macos
          path: dist/SHA256SUMS-macos.txt

  publish:
    name: Prepare tagged release for maintainer signing
    permissions:
      contents: write
      id-token: write
      attestations: write
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout manifest utility
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download Windows portable
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: LawPDF-windows-portable-x64
          path: dist

      - name: Download Windows installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: LawPDFSetup-x64
          path: dist

      - name: Download macOS package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: LawPDF-macos
          path: dist

      - name: Download Windows checksum fragment
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: LawPDF-SHA256SUMS-windows
          path: checksums

      - name: Download macOS checksum fragment
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: LawPDF-SHA256SUMS-macos
          path: checksums

      - name: Assemble and verify SHA-256 manifest
        run: |
          cat checksums/SHA256SUMS-windows.txt checksums/SHA256SUMS-macos.txt > dist/SHA256SUMS.txt
          (cd dist && sha256sum --check SHA256SUMS.txt)

      - name: Create release authentication payload
        run: python tools/make_update_manifest.py --directory dist --version "${GITHUB_REF_NAME#v}" --commit "$GITHUB_SHA"

      - name: Attest package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'dist/LawPDF*'

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=(
            dist/LawPDF-windows-portable-x64.zip
            dist/LawPDFSetup-x64.exe
            dist/LawPDF-macos.zip
            dist/SHA256SUMS.txt
            dist/UPDATE-MANIFEST.json
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "A release already exists. Refusing to overwrite published artifacts." >&2
            exit 1
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --draft \
              --title "LawPDF $GITHUB_REF_NAME" \
              --notes "Release candidate awaiting maintainer review and UPDATE-MANIFEST.sig. See docs/RELEASING.md for signing, installation evidence, and publication gates."
          fi
