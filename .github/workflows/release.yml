name: Release

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    name: Windows x64
    timeout-minutes: 90
    runs-on: windows-latest
    env:
      CARGO_TARGET_DIR: C:\tmp\lawpdf-target

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure Rust
        shell: pwsh
        run: |
          rustup show active-toolchain
          rustup target add x86_64-pc-windows-msvc

      - name: Fetch pinned CatBoost runtime
        shell: pwsh
        run: .\scripts\fetch-catboost-windows.ps1

      - name: Verify release manifest and assets
        shell: pwsh
        run: |
          $arguments = @(
            "tools\verify_release_manifest.py",
            "--platform", "windows",
            "--require-platform-library"
          )
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $arguments += @("--expected-version", $env:GITHUB_REF_NAME.TrimStart("v"))
          }
          python @arguments

      - name: Run all regression tests
        shell: pwsh
        run: |
          cargo test --release --locked --target x86_64-pc-windows-msvc

      - name: Build release
        shell: pwsh
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Stage target executable
        shell: pwsh
        run: |
          $stagingDir = Join-Path $env:CARGO_TARGET_DIR "release"
          New-Item -ItemType Directory -Force -Path $stagingDir | Out-Null
          Copy-Item (Join-Path $env:CARGO_TARGET_DIR "x86_64-pc-windows-msvc\release\lawpdf.exe") (Join-Path $stagingDir "lawpdf.exe") -Force

      - name: Build portable zip
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File .\scripts\package-windows.ps1 -Configuration release

      - name: Check on-device OCR on a scanned page
        env:
          LAWPDF_OCR_ENGINE: system
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP 'ocr-self-test-windows.json'
          $pdf = (Resolve-Path 'tests/fixtures/ocr/scanned-law-review-sample.pdf').Path
          $process = Start-Process -FilePath 'dist/LawPDF-portable/lawpdf.exe' `
            -ArgumentList @('--ocr-self-test', '--pdf', "`"$pdf`"", '--page', '1', '--output', "`"$report`"") `
            -NoNewWindow -PassThru -Wait
          Get-Content -LiteralPath $report
          $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($null -eq $result.engine) {
            # Hosted runners may lack a Windows OCR language; report rather than fail.
            Write-Warning "No OCR engine on this runner: $($result.engine_error)"
          } elseif ($process.ExitCode -ne 0 -or -not $result.requirements_met) {
            throw "On-device OCR failed with $($result.engine)."
          }

      - name: Upload OCR self-test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LawPDF-Windows-ocr-self-test
          path: ${{ runner.temp }}/ocr-self-test-windows.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_NAME -like "v*") {
            $env:GITHUB_REF_NAME.TrimStart("v")
          } else {
            (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          }
          $isccCandidates = @(
            (Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"),
            (Join-Path $env:ProgramFiles "Inno Setup 6\ISCC.exe"),
            (Join-Path $env:LOCALAPPDATA "Programs\Inno Setup 6\ISCC.exe")
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe was not found after installing Inno Setup." }
          & $iscc .\packaging\windows\LawPDF.iss /DAppVersion=$version

      - name: Create Windows SHA-256 manifest fragment
        shell: pwsh
        run: |
          $assets = @(
            "LawPDFSetup-x64.exe",
            "LawPDF-windows-portable-x64.zip"
          )
          $lines = foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath (Join-Path "dist" $asset) -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $asset"
          }
          Set-Content -LiteralPath dist\SHA256SUMS-windows.txt -Value $lines -Encoding ascii

      - name: Install the exact Windows release and verify it
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $installer = 'dist/LawPDFSetup-x64.exe'
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          $executableHash = (Get-FileHash -LiteralPath 'dist/LawPDF-portable/lawpdf.exe' -Algorithm SHA256).Hash
          ./scripts/verify-windows-install.ps1 -Installer $installer -ExpectedVersion $version -ExpectedSha256 $hash -ExpectedExecutableSha256 $executableHash

      - name: Upload Windows installation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LawPDF-Windows-installation-evidence
          path: C:/tmp/lawpdf-install-evidence
          retention-days: 14

      - name: Upload portable artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LawPDF-windows-portable-x64
          path: dist/LawPDF-windows-portable-x64.zip

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LawPDFSetup-x64
          path: dist/LawPDFSetup-x64.exe

      - name: Upload Windows checksum fragment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LawPDF-SHA256SUMS-windows
          path: dist/SHA256SUMS-windows.txt

  macos:
    name: macOS arm64
    timeout-minutes: 90
    runs-on: macos-15
    env:
      CARGO_TARGET_DIR: /tmp/lawpdf-target

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure Rust
        run: rustup show active-toolchain

      - name: Verify release manifest and assets
        run: |
          args=(--platform macos --require-platform-library)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            args+=(--expected-version "${GITHUB_REF_NAME#v}")
          fi
          python3 tools/verify_release_manifest.py "${args[@]}"

      - name: Run all regression tests
        run: |
          cargo test --release --locked

      - name: Build and verify app bundle
        run: bash scripts/package-macos.sh

      - name: Check on-device OCR on a scanned page
        env:
          LAWPDF_OCR_ENGINE: system
        run: |
          report="$RUNNER_TEMP/ocr-self-test-macos.json"
          app_binary="$(find dist -path '*.app/Contents/MacOS/*' -type f -perm -u+x | head -n 1)"
          "$app_binary" --ocr-self-test --pdf tests/fixtures/ocr/scanned-law-review-sample.pdf --page 1 --output "$report"
          cat "$report"

      - name: Upload OCR self-test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LawPDF-macOS-ocr-self-test
          path: ${{ runner.temp }}/ocr-self-test-macos.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Create macOS SHA-256 manifest fragment
        run: (cd dist && shasum -a 256 LawPDF-macos.zip > SHA256SUMS-macos.txt)

      - name: Upload macOS artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LawPDF-macos
          path: dist/LawPDF-macos.zip

      - name: Upload macOS checksum fragment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LawPDF-SHA256SUMS-macos
          path: dist/SHA256SUMS-macos.txt

  linux:
    name: Linux x86_64
    timeout-minutes: 90
    runs-on: ubuntu-24.04
    env:
      CARGO_TARGET_DIR: /tmp/lawpdf-target
      LAWPDF_DIST_DIR: /tmp/lawpdf-dist
      LAWPDF_OCR_ENGINE: tesseract
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            libgl1-mesa-dev libwayland-dev libxkbcommon-dev libx11-dev \
            libxcursor-dev libxi-dev libxrandr-dev libfontconfig1-dev \
            libdbus-1-dev libssl-dev tesseract-ocr tesseract-ocr-eng \
            desktop-file-utils cups-client
      - name: Fetch pinned native libraries
        run: |
          ./scripts/fetch-pdfium-linux.sh
          ./scripts/fetch-catboost-linux.sh
      - name: Verify release manifest and assets
        run: |
          args=(--platform linux --require-platform-library)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            args+=(--expected-version "${GITHUB_REF_NAME#v}")
          fi
          python3 tools/verify_release_manifest.py "${args[@]}"
      - name: Run regression tests
        run: cargo test --release --locked
      - name: Build and verify portable package
        run: ./scripts/package-linux.sh
      - name: Smoke-test the extracted package outside the checkout
        run: |
          smoke="$RUNNER_TEMP/lawpdf-extracted"
          mkdir -p "$smoke"
          tar -xzf "$LAWPDF_DIST_DIR/LawPDF-linux-x86_64.tar.gz" -C "$smoke"
          fixture="$GITHUB_WORKSPACE/tests/fixtures/ocr/scanned-law-review-sample.pdf"
          cd "$RUNNER_TEMP"
          env -u LAWPDF_MODEL_DIR "$smoke/LawPDF-linux-x86_64/lawpdf" \
            --lm2-runtime-status --require-native --require-context --require-arbiter \
            --require-note-head --require-link-ranker > linux-runtime.json
          "$smoke/LawPDF-linux-x86_64/lawpdf" --ocr-self-test \
            --pdf "$fixture" --page 1 --output "$RUNNER_TEMP/linux-ocr.json"
          XDG_DATA_HOME="$smoke/data" "$smoke/LawPDF-linux-x86_64/install.sh"
          desktop-file-validate "$smoke/data/applications/lawpdf.desktop"
          XDG_DATA_HOME="$smoke/data" "$smoke/LawPDF-linux-x86_64/uninstall.sh"
          test ! -f "$smoke/data/applications/lawpdf.desktop"
      - name: Upload Linux package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LawPDF-linux-x86_64
          path: /tmp/lawpdf-dist/LawPDF-linux-x86_64.tar.gz
          if-no-files-found: error
      - name: Upload Linux checksum fragment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LawPDF-SHA256SUMS-linux
          path: /tmp/lawpdf-dist/SHA256SUMS-linux.txt
          if-no-files-found: error
      - name: Upload Linux smoke evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LawPDF-Linux-smoke-evidence
          path: |
            ${{ runner.temp }}/linux-runtime.json
            ${{ runner.temp }}/linux-ocr.json
          if-no-files-found: error


  publish:
    name: Prepare tagged release for maintainer signing
    permissions:
      contents: write
      id-token: write
      attestations: write
    timeout-minutes: 20
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout manifest utility
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download Windows portable
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: LawPDF-windows-portable-x64
          path: dist

      - name: Download Windows installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: LawPDFSetup-x64
          path: dist

      - name: Download macOS package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: LawPDF-macos
          path: dist

      - name: Download Linux package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: LawPDF-linux-x86_64
          path: dist

      - name: Download Linux checksum fragment
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: LawPDF-SHA256SUMS-linux
          path: checksums

      - name: Download Windows checksum fragment
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: LawPDF-SHA256SUMS-windows
          path: checksums

      - name: Download macOS checksum fragment
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: LawPDF-SHA256SUMS-macos
          path: checksums

      - name: Assemble and verify SHA-256 manifest
        run: |
          cat checksums/SHA256SUMS-windows.txt checksums/SHA256SUMS-macos.txt checksums/SHA256SUMS-linux.txt > dist/SHA256SUMS.txt
          (cd dist && sha256sum --check SHA256SUMS.txt)

      - name: Create release authentication payload
        run: python tools/make_update_manifest.py --directory dist --version "${GITHUB_REF_NAME#v}" --commit "$GITHUB_SHA"

      - name: Attest package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'dist/LawPDF*'

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=(
            dist/LawPDF-windows-portable-x64.zip
            dist/LawPDFSetup-x64.exe
            dist/LawPDF-macos.zip
            dist/LawPDF-linux-x86_64.tar.gz
            dist/SHA256SUMS.txt
            dist/UPDATE-MANIFEST.json
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "A release already exists. Refusing to overwrite published artifacts." >&2
            exit 1
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --draft \
              --title "LawPDF $GITHUB_REF_NAME" \
              --notes "Release candidate awaiting maintainer review and UPDATE-MANIFEST.sig. See docs/RELEASING.md for signing, installation evidence, and publication gates."
          fi
