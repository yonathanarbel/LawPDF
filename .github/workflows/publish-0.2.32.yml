name: Publish authorized LawPDF 0.2.32
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-0.2.32.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-lawpdf-0.2.32
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'yonathanarbel/LawPDF' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact artifacts and maintainer signature, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: yonathanarbel/LawPDF
        run: python3 tools/publish_0_2_32.py --publish
